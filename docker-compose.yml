version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devtrack-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devtrack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devtrack-network

  redis:
    image: redis:7-alpine
    container_name: devtrack-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - devtrack-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: devtrack-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - devtrack-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: devtrack-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - devtrack-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: devtrack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - devtrack-network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: devtrack-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devtrack-network

networks:
  devtrack-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
